spring.application.name=TRAVEL-SERVICE
server.port=8082

jwt.secret=${JWT_SECRET}

spring.datasource.url=jdbc:postgresql://postgres:5432/travel_db
spring.datasource.username=${TRAVEL_DB_USERNAME}
spring.datasource.password=${TRAVEL_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

app.admin.enabled=true
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB