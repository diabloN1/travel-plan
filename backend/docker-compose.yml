services:
  user:
    image: letstravel/user
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user
        APP_PORT: 8081
    env_file:
      - ../.env
    networks:
      - travel-internal-network

  travel:
    image: letstravel/travel
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: travel
        APP_PORT: 8082
    env_file:
      - ../.env
    networks:
      - travel-internal-network

networks:
  travel-internal-network:
    external: true
